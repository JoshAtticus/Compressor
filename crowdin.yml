project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true

files:
  - source: /app/src/main/res/values/strings.xml
    translation: /app/src/main/res/values-%android_code%/strings.xml
    languages_mapping:
      android_code:
        ar: ar
        de: de
        es-ES: es
        ja: ja
        ko: ko
        ru: ru
        pt-BR: pt-rBR
        zh-CN: zh-rCN
        zh-TW: zh-rTW
