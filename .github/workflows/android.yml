name: Build PR Debug APK

on:
  pull_request_target:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number'
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          # Check out the actual head commit of the PR
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Determine PR Number
        id: pr_context
        run: |
          if [ "${{ github.event_name }}" == "pull_request_target" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "PR_NUMBER=${{ github.event.pull_request.number || github.event.number }}" >> $GITHUB_ENV
          else
            echo "PR_NUMBER=${{ inputs.pr_number }}" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. FIND OR CREATE THE INITIAL COMMENT
      - name: Post "Building" Comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const marker = '<!-- bot-pr-build-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = parseInt(process.env.PR_NUMBER);
            
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number
            });
            const botComment = comments.data.find(c => c.body.includes(marker));
            
            const body = `${marker}
            ### 🔨 Building Debug APK...
            
            <details>
            <summary>View Status</summary>
            Building on GitHub Actions...
            </details>`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: botComment.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      # 2. RUN THE BUILD
      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace | tee build.log

      # 3. UPLOAD THE APK ARTIFACT
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compressor-debug-pr-${{ env.PR_NUMBER }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

      # 4. READ LOGS
      - name: Process Logs
        if: always()
        id: process_logs
        run: |
          if [ -f build.log ]; then
            tail -n 150 build.log > trimmed_log.txt
          else
            echo "Build log not found. The build step may not have produced output." > trimmed_log.txt
          fi
          echo "LOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
          cat trimmed_log.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5. UPDATE COMMENT WITH RESULT
      - name: Update Comment with Result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          LOGS: ${{ steps.process_logs.outputs.LOG_CONTENT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const marker = '<!-- bot-pr-build-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = parseInt(process.env.PR_NUMBER);
            const logs = process.env.LOGS;
            const runUrl = process.env.RUN_URL;
            const status = process.env.STATUS;
            
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number
            });
            const botComment = comments.data.find(c => c.body.includes(marker));
            
            let title = status === 'success' ? '## ✅ Build Successful' : '## ❌ Build Failed';
            let downloadSection = status === 'success' 
              ? `**Debug APK Ready**
                 
                 [Download from Artifacts](${runUrl})
                 
                 **Note:** You may need to uninstall the existing version before installing this debug build.`
              : `**The build encountered errors.** See the logs below for details.`;

            const body = `${marker}
            ${title}
            
            ${downloadSection}
            
            <details>
            <summary>Build Logs</summary>
            
            \`\`\`text
            ${logs}
            \`\`\`
            </details>`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: botComment.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }