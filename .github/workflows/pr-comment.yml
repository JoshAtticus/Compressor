name: Post PR Build Comment

on:
  workflow_run:
    workflows: ["Build PR Debug APK"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Download Metadata Artifact
        uses: actions/download-artifact@v4
        with:
          name: pr_data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read Metadata & Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bot-pr-build-comment -->';
            const { owner, repo } = context.repo;
            
            const issue_number = parseInt(fs.readFileSync('PR_NUMBER', 'utf8').trim());
            const status = fs.readFileSync('STATUS', 'utf8').trim();
            const logs = fs.readFileSync('trimmed_log.txt', 'utf8');
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}';

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number
            });
            const botComment = comments.data.find(c => c.body.includes(marker));

            const title = status === 'success' ? '## ✅ Build Successful' : '## ❌ Build Failed';
            const downloadSection = status === 'success'
              ? `**Debug APK Ready**\n\n[Download from Artifacts](${runUrl})\n\n**Note:** You may need to uninstall existing versions first.`
              : `**The build encountered errors.** See logs below.`;

            const body = `${marker}\n${title}\n\n${downloadSection}\n\n<details>\n<summary>Build Logs</summary>\n\n\`\`\`text\n${logs}\n\`\`\`\n</details>`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: botComment.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }